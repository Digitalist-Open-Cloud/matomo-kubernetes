{{- $gw := include "matomo.gatewayApi" (list $ "dashboard") | fromYaml -}}
{{- if and .Values.matomo.dashboard.enabled $gw.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matomo-dashboard
  namespace: {{.Values.namespace}}
  labels:
    app: matomo-dashboard
    {{- with $gw.extralabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $gw.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $gw.parentRefs | nindent 4 }}
  hostnames:
    - {{.Values.matomo.dashboard.hostname}}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        {{- if .Values.matomo.dashboard.loadbalancer }}
        - name: matomo-dashboard-lb
          port: 80
        {{- else }}
        - name: matomo-dashboard
          port: 8080
        {{- end }}
{{- end }}

---
{{- if .Values.matomo.tagManagerRegenerate.enabled }}
{{- if and (not .Values.matomo.tagManagerRegenerate.volume.create) (not .Values.matomo.tagManagerRegenerate.volume.existingClaim) }}
{{- fail "matomo.tagManagerRegenerate.volume.existingClaim must be set when matomo.tagManagerRegenerate.volume.create is false" }}
{{- end }}
{{- if .Values.matomo.tagManagerRegenerate.volume.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matomo-tagmanager-js
  namespace: {{ .Values.namespace }}
  {{- with merge .Values.matomo.tagManagerRegenerate.volume.labels (dict "app" "matomo-tagmanager-regenerate") }}
  labels:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteMany
  {{- if .Values.matomo.tagManagerRegenerate.volume.storageClassName }}
  storageClassName: {{ .Values.matomo.tagManagerRegenerate.volume.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.matomo.tagManagerRegenerate.volume.size }}

---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo-tagmanager-regenerate
  namespace: {{.Values.namespace}}
  labels:
    app: matomo-tagmanager-regenerate
{{- if .Values.matomo.extralabels }}
{{ toYaml .Values.matomo.extralabels | indent 4 }}
{{- end }}
spec:
  replicas: 1
  # One regenerator at a time; never two pods writing the shared volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matomo-tagmanager-regenerate
  template:
    metadata:
      labels:
        app: matomo-tagmanager-regenerate
{{- if .Values.matomo.extralabels }}
{{ toYaml .Values.matomo.extralabels | indent 8 }}
{{- end }}
      annotations:
{{ include "matomo.podAnnotations" . | indent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.matomo.automountServiceAccountToken }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Same fsGroup as the dashboard/tracker pods, so files written to the
        # shared PVC are readable by them.
        fsGroup: {{ .Values.matomo.tagManagerRegenerate.fsGroup | default .Values.matomo.runAsUser }}
{{ include "matomo.initWithWarmup" . | nindent 6 }}
      containers:
      - name: matomo
        image: {{.Values.matomo.image}}
        imagePullPolicy: Always
        securityContext:
          runAsUser: {{.Values.matomo.runAsUser}}
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        {{- if .Values.matomo.tagManagerRegenerate.resources }}
        resources:
{{ toYaml .Values.matomo.tagManagerRegenerate.resources | indent 10 }}
        {{- end }}
        livenessProbe: {{- include "matomo.probe" (dict "override" .Values.matomo.tagManagerRegenerate.livenessProbe "default" (include "matomo.probe.default.supervisord.liveness" .)) | nindent 10 }}
        readinessProbe: {{- include "matomo.probe" (dict "override" .Values.matomo.tagManagerRegenerate.readinessProbe "default" (include "matomo.probe.default.supervisord.readiness" .)) | nindent 10 }}
        command: [ 'sh' , '-c' , 'supervisord -n' ]
        env:
        - name: MARIADB_MATOMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.db.password.secretKeyRef.name }}
              key: {{ .Values.db.password.secretKeyRef.key }}
{{ include "matomo.license" . | nindent 8 }}
        volumeMounts:
          - name: static-data
            mountPath: /var/www/html
          # Mounted over the generated container JS path, so
          # `regenerate-released-containers` writes straight to the shared PVC.
          - name: tagmanager-js
            mountPath: /var/www/html/js
          - name: matomo-supervisor-tagmanager-regenerate
            mountPath: /etc/supervisor.d
            readOnly: true
{{ include "matomo.images.pullSecrets" ( dict "images" (list .Values.matomo) "global" .Values.global) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: matomo-configuration
        configMap:
          name: matomo-configuration
      - name: static-data
        emptyDir: {}
      - name: tagmanager-js
        persistentVolumeClaim:
          claimName: {{ include "matomo.tagManagerJsClaimName" . }}
      - name: matomo-supervisor-tagmanager-regenerate
        configMap:
          name: matomo-supervisor-tagmanager-regenerate
{{- end -}}
